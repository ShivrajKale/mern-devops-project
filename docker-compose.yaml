version: "3.8"

services:
  # ===== Tier 3: Database =====
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bookstore
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Tier 2: Backend API =====
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "5555:5555"
    environment:
      - mongoDBURL=mongodb://mongodb:27017/bookstore
      - PORT=5555
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5555/health"]
      interval: 30s
      timeout: 10s
      retries: 3  

  # ===== Tier 1: Frontend =====
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:
    driver: local

networks:
  app-network:
    driver: bridge
    