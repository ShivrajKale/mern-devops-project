name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # Manual trigger

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/mern-backend:latest,${{ env.DOCKERHUB_USERNAME }}/mern-backend:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/mern-frontend:latest,${{ env.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mern-devops-project

            # Pull latest code
            git pull origin main

            # Pull latest images from DockerHub
            docker pull ${{ env.DOCKERHUB_USERNAME }}/mern-backend:latest
            docker pull ${{ env.DOCKERHUB_USERNAME }}/mern-frontend:latest

            # Restart containers with new images
            # In the SSH script, change:
            docker compose down
            docker compose -f docker-compose.prod.yaml up -d 

            # Cleanup old images
            docker image prune -f

            echo "Deployment complete!"